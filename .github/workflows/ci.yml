name: Enterprise CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Stage 1: Quality, Linting & Type Safety
  # ---------------------------------------------------------------------------
  code-quality:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy

      - name: Run Ruff Linter
        run: ruff check src/ tests/

      - name: Run Type Checking
        run: mypy src/ --ignore-missing-imports

  # ---------------------------------------------------------------------------
  # Stage 2: Security & Vulnerability Auditing (SAST & SCA)
  # ---------------------------------------------------------------------------
  security-audit:
    name: Security & Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Security Scanners
        run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit

      - name: Run Bandit SAST Security Analysis
        run: bandit -r src/ -ll -ii

      - name: Run pip-audit Dependency Vulnerability Scan
        run: |
          pip install -e .[all]
          pip-audit --desc on

  # ---------------------------------------------------------------------------
  # Stage 3: Multi-Version Test Matrix & Coverage
  # ---------------------------------------------------------------------------
  test-matrix:
    name: Test Suite (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python }}"
          cache: "pip"

      - name: Install Package & Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[all,dev]

      - name: Execute Full Test Suite with Coverage
        run: |
          python -m unittest discover -s tests -v

  # ---------------------------------------------------------------------------
  # Stage 4: Kubernetes & Helm Chart Validation
  # ---------------------------------------------------------------------------
  helm-validation:
    name: Helm Chart Lint & Dry-run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.14.0"

      - name: Lint Helm Chart
        run: helm lint deploy/helm/fandomwatch

      - name: Dry-Run Template Rendering
        run: helm template fandomwatch deploy/helm/fandomwatch --debug

  # ---------------------------------------------------------------------------
  # Stage 5: Container Build & Security Scan
  # ---------------------------------------------------------------------------
  docker-validation:
    name: Docker Build & Vulnerability Scan
    runs-on: ubuntu-latest
    needs: [code-quality, test-matrix]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: false
          tags: fandomwatch:test
          load: true

      - name: Run Trivy Container Security Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: fandomwatch:test
          format: "table"
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"
