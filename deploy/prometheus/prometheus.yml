global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alert_rules.yml"

scrape_configs:
  - job_name: "fandomwatch-api"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["fandomwatch-api:8000"]
        labels:
          service: "fandomwatch"
          env: "production"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
