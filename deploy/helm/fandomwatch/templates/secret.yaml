apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fandomwatch.fullname" . }}-secret
  labels:
    {{- include "fandomwatch.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.secrets.DATABASE_URL | quote }}
  REDIS_URL: {{ .Values.secrets.REDIS_URL | quote }}
  YOUTUBE_API_KEY: {{ .Values.secrets.YOUTUBE_API_KEY | default "" | quote }}
  ANTHROPIC_API_KEY: {{ .Values.secrets.ANTHROPIC_API_KEY | default "" | quote }}
  GEMINI_API_KEY: {{ .Values.secrets.GEMINI_API_KEY | default "" | quote }}
