apiVersion: v1
kind: Secret
metadata:
  name: fandomwatch-secret
  namespace: fandomwatch
  labels:
    app.kubernetes.io/name: fandomwatch
type: Opaque
stringData:
  DATABASE_URL: "postgresql://fandom_user:fandom_secret@fandomwatch-postgresql:5432/fandom_db"
  REDIS_URL: "redis://:redis_secret@fandomwatch-redis:6379/0"
  YOUTUBE_API_KEY: ""
  ANTHROPIC_API_KEY: ""
  GEMINI_API_KEY: ""
